databaseChangeLog:
  - logicalFilePath: 20260131-create-tbl-role.yaml
  - changeSet:
      id: 20260131-1-create-tbl-role
      author: adiljafarov
      changes:
        - createTable:
            schemaName: carsdb
            tableName: role
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: varchar(255)