databaseChangeLog:
  - logicalFilePath: 20260131-create-tbl-feature.yaml
  - changeSet:
      id: 20260131-1-create-tbl-feature
      author: adiljafarov
      changes:
        - createTable:
            schemaName: carsdb
            tableName: feature
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: feature_id
                  type: int
                  constraints:
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: category
                  type: varchar(255)